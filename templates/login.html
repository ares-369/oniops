<!DOCTYPE html>
<html lang="en" data-product="oniops" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - {{ instance or 'OniOps' }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg" />
  <script src="/static/theme.js"></script>
  <style>*{box-sizing:border-box}body{margin:0}</style>
  <link rel="stylesheet" href="/static/mdi/css/icons.css" />
  <link rel="stylesheet" href="/static/suite.css" />
</head>
<body class="login-page">
  <form class="login-card" method="POST" action="/login">
    <div class="brand big"><img class="logo" src="/static/img/logo.svg" alt="" />{{ instance or 'OniOps' }}</div>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <label>Username<input id="username" name="username" autocomplete="username" required autofocus /></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
    <button type="submit"><span class="mdi mdi-login"></span> Sign in</button>
  </form>
</body>
</html>
